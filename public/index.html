<!doctype html>
<html lang="en" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Kashan Portfolio</title>
<meta name="description" content="I connect creative execution, smarter workflows, and performance-focused marketing to help businesses move forward.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&amp;display=swap">
<link rel="stylesheet" href="/styles.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px;font:16px system-ui;color:#efe6d2">This portfolio needs JavaScript to run.</p></noscript>
<script>
/* Loads the published content (from the database through /api/content), then starts the app.
   If the API is unavailable the bundled seed-content.json is shown so the site still renders. */
(function () {
  function timeout(ms) { return new Promise(function (_, rej) { setTimeout(rej, ms); }); }
  function getJson(url) { return fetch(url, { credentials: 'same-origin' }).then(function (r) { if (!r.ok) throw 0; return r.json(); }); }
  var content = Promise.race([getJson('/api/content'), timeout(8000)]).catch(function () { return null; }).then(function (j) {
    if (j && j.state) return { state: j.state, version: j.version || 0, source: 'database' };
    return getJson('/seed-content.json').then(function (s) { return { state: s, version: 0, source: 'seed' }; });
  });
  var ready = new Promise(function (res) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', res); else res();
  });
  Promise.all([content, ready]).then(function (r) {
    window.__PF_BOOT = r[0];
    var s = document.createElement('script'); s.src = '/app.js'; s.async = false; document.body.appendChild(s);
  }).catch(function () {
    document.documentElement.classList.remove('booting');
    document.getElementById('app').textContent = 'The site could not load its content. Please refresh.';
  });
})();
</script>
</body>
</html>
